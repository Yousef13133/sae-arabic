[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sae-arabic"
version = "0.1.0"
description = "Open-source toolkit for training and causally validating Sparse Autoencoder (SAE) features in Arabic LLMs using ALDi as external ground truth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yousef Al-Halabi" }]
keywords = ["sparse-autoencoder", "interpretability", "arabic", "sae", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyter>=1.0"]

[project.urls]
Repository = "https://github.com/Yousef13133/sae-arabic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
